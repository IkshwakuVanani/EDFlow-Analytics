databases:
  - name: edflow-orchestrator-db
    databaseName: edflow
    user: edflow
    plan: free

services:
  - type: web
    name: edflow-orchestrator-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: uvicorn app.production:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edflow-orchestrator-db
          property: connectionString
      - key: EDFLOW_ALLOW_REGISTRATION
        value: "true"
      - key: CORS_ORIGINS
        sync: false
